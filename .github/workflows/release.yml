name: Release

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1. Do not
      # `npm install -g npm@latest` here: it can resolve to a major that
      # needs a newer Node than .nvmrc pins and fail with EBADENGINE.
      - name: Check npm version supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          node -e "
            const [major, minor, patch] = '$NPM_VERSION'.split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              console.error('npm $NPM_VERSION does not support trusted publishing (need >= 11.5.1)');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build package
        run: pnpm build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NPM_TOKEN: notti-web-sdk needs a Trusted Publisher configured on
      # npmjs.com (Package settings -> Trusted Publisher) pointing at this
      # repo and this workflow file. That can only be attached to a package
      # that already exists, so the very first publish is done by hand from a
      # maintainer's terminal (`npm publish --access public`); after that this
      # job handles every release.
      - name: Publish to npm
        run: npm publish --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
